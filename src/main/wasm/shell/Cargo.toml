[package]
name = "oc-wasm-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal interactive shell for OpenComputers' WebAssembly architecture, shipped as a pre-programmed EEPROM."

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "realloc"] }
lol_alloc = "0.4.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

